# 例如windows系统就在：C:\Users\xxx\AppData\Local\Temp\tomcat.8080.4654207823524165758，tomcat.8080.4654207823524165758是生成的，每次启动生成的是不一样的
#server.tomcat.basedir



# tomcat 服务器最大连接数，默认值是8192
server.tomcat.max-connections=8192
# tomcat 服务器等待队列的长度，默认值是100，即如果此时服务器接收的连接数已经超过了最大连接数，新来的连接进入等待队列中，
# 该属性值就是声明等待队列的长度，如果超过等待队列长度，连接将会被丢弃
server.tomcat.accept-count=100
# tomcat 线程池最大线程数，默认值是200
server.tomcat.threads.max=200
# tomcat 线程池最小线程数，默认值是10
server.tomcat.threads.min-spare=10

# 最大并发量，这里有不同的理解
# 1.如果在乎tomcat运行能够同时处理的任务数量，那最大并发量可能理解成最大工作线程数（max-threads）---不包含队列里的数量（acceptCount）
# 2.如果在乎tomcat运行能够接纳的最大最多的任务数量，那最大并发量可以理解成最大连接数（max-connections）+ 队列长度的数量（accept-count） --- 包含队列里的数量（acceptCount）
# 这里 tomcat 是第二点，只关注能够接纳的最大最多的任务数量，
# 例如最大连接数是8192，等待队列是100，线程池最大线程数是200，那么tomcat最多只能接收8292个连接，即最大连接数（max-connections）+ 队列长度的数量（accept-count）
# 也就是正在线程池中处理的连接也是计算最大连接数内的

# 连接超时时间，socket 调用 read() 方法等待读取时间，如果超出该时间，主动断开连接
