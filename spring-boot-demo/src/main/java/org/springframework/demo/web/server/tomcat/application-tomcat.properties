spring.application.name=tomcat-demo

## 服务器一般配置项

# web服务绑定的网络接口的IP地址，支持配置多个，以逗号分隔开
# 理解：之前没有理解，可以这样理解，就是服务监听的地址，例如配置了：192.168.1.100，那么服务会监听该地址的网络请求
# 默认情况下，springboot 应用程序会绑定到所有可用的网络接口（即监听所有IP地址），这意味着你的应用程序将对所有网络接口上的客户端开放。
# 该配置项应用场景：
# 1.限制访问（安全性）：如果你希望应用程序只对特定的网络或IP地址开放，你可以设置 server.address 为特定的IP地址。
# 2.多网卡环境：在多网络接口的服务器上，你可能希望应用程序只绑定到一个特定的网络接口。
# 3.避免冲突：如果你的应用程序需要在同一台机器上运行多个实例，并且这些实例需要监听不同的端口，你可以为每个实例设置不同的 server.address。
#server.address
#server.port=8080
#server.shutdown=immediate
#server.compression.enabled=false
#server.compression.excluded-user-agents
#server.compression.mime-types=[text/html, text/xml, text/plain, text/css, text/javascript, application/javascript, application/json, application/xml]
#server.compression.min-response-size
#server.error.include-binding-errors
